<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-label="4designer UI hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0f12"/>
      <stop offset="100%" stop-color="#16181d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="480" fill="url(#bg)"/>
  <!-- AppBar -->
  <rect x="0" y="0" width="920" height="40" fill="#12141a"/>
  <text x="20" y="26" fill="#f0a020" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">4designer</text>
  <!-- Marshaled | Render segmented -->
  <rect x="380" y="8" width="160" height="24" rx="6" fill="#1c1f26" stroke="#2a2e36"/>
  <text x="400" y="25" fill="#8b919a" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Marshaled</text>
  <rect x="458" y="10" width="72" height="20" rx="4" fill="#f0a020"/>
  <text x="472" y="24" fill="#0e0f12" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">Render</text>
  <!-- LEDs -->
  <circle cx="860" cy="20" r="5" fill="#3ecf8e"/>
  <circle cx="880" cy="20" r="5" fill="#3ecf8e"/>
  <!-- Outliner -->
  <rect x="0" y="40" width="140" height="440" fill="#16181d" stroke="#2a2e36"/>
  <text x="12" y="62" fill="#8b919a" font-family="Segoe UI, system-ui, sans-serif" font-size="10" letter-spacing="0.08em">OUTLINER</text>
  <rect x="10" y="76" width="120" height="22" rx="4" fill="#1c1f26" stroke="#f0a020"/>
  <text x="18" y="91" fill="#e8eaed" font-family="Segoe UI, system-ui, sans-serif" font-size="11">geo1</text>
  <rect x="10" y="104" width="120" height="22" rx="4" fill="#1c1f26"/>
  <text x="18" y="119" fill="#8b919a" font-family="Segoe UI, system-ui, sans-serif" font-size="11">light1</text>
  <rect x="10" y="132" width="120" height="22" rx="4" fill="#1c1f26"/>
  <text x="18" y="147" fill="#8b919a" font-family="Segoe UI, system-ui, sans-serif" font-size="11">cam1</text>
  <!-- Viewport -->
  <rect x="140" y="40" width="580" height="440" fill="#0a0b0e"/>
  <!-- ground grid hint -->
  <g stroke="#1e222a" stroke-width="1">
    <line x1="180" y1="420" x2="680" y2="420"/>
    <line x1="220" y1="400" x2="640" y2="400"/>
    <line x1="260" y1="380" x2="600" y2="380"/>
  </g>
  <!-- 3D box -->
  <g fill="none" stroke="#f0a020" stroke-width="2" filter="url(#glow)">
    <path d="M360 220 L460 180 L560 220 L560 320 L460 360 L360 320 Z"/>
    <path d="M360 220 L460 260 L560 220"/>
    <path d="M460 260 L460 360"/>
  </g>
  <!-- floating toolbar -->
  <rect x="156" y="52" width="420" height="28" rx="6" fill="rgba(22,24,29,0.85)" stroke="#2a2e36"/>
  <rect x="164" y="58" width="52" height="16" rx="8" fill="#f0a020"/>
  <text x="174" y="70" fill="#0e0f12" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">Auto · idle</text>
  <text x="230" y="70" fill="#8b919a" font-family="Segoe UI, system-ui, sans-serif" font-size="10">render1 · Load meshes · ¢</text>
  <!-- Preview panel -->
  <rect x="400" y="260" width="280" height="180" rx="8" fill="rgba(22,24,29,0.92)" stroke="#f0a020" stroke-width="1.5"/>
  <rect x="400" y="260" width="280" height="26" rx="8" fill="#1c1f26"/>
  <text x="412" y="278" fill="#8b919a" font-family="Segoe UI, system-ui, sans-serif" font-size="10">PREVIEW</text>
  <text x="470" y="278" fill="#e8eaed" font-family="Segoe UI, system-ui, sans-serif" font-size="10">/project1/render1</text>
  <!-- faux JPEG -->
  <rect x="412" y="298" width="256" height="128" fill="#12141a"/>
  <ellipse cx="540" cy="362" rx="40" ry="28" fill="#f0a020" opacity="0.35"/>
  <rect x="500" y="340" width="80" height="44" fill="none" stroke="#f0a020" stroke-width="1.5"/>
  <!-- resize corner cue -->
  <path d="M668 428 L676 428 L676 420" fill="none" stroke="#f0a020" stroke-width="2"/>
  <!-- Inspector -->
  <rect x="720" y="40" width="200" height="440" fill="#16181d" stroke="#2a2e36"/>
  <text x="732" y="62" fill="#8b919a" font-family="Segoe UI, system-ui, sans-serif" font-size="10" letter-spacing="0.08em">INSPECTOR</text>
  <text x="732" y="90" fill="#e8eaed" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">geo1</text>
  <text x="732" y="118" fill="#8b919a" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Translate</text>
  <rect x="732" y="126" width="56" height="20" rx="3" fill="#1c1f26"/><text x="740" y="140" fill="#e8eaed" font-family="Segoe UI, system-ui, sans-serif" font-size="10">0.00</text>
  <rect x="796" y="126" width="56" height="20" rx="3" fill="#1c1f26"/><text x="804" y="140" fill="#e8eaed" font-family="Segoe UI, system-ui, sans-serif" font-size="10">1.20</text>
  <rect x="860" y="126" width="48" height="20" rx="3" fill="#1c1f26"/><text x="868" y="140" fill="#e8eaed" font-family="Segoe UI, system-ui, sans-serif" font-size="10">0.00</text>
</svg>
